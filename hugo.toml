baseURL = "https://example.org/"
locale = "en-US"
title = "FP Enthusiast"
theme = "fp-enthusiast"

enableRobotsTXT = true
summaryLength = 30

[pagination]
  pagerSize = 8

[params]
  description    = "Ink, nibs, and paper — notes from a fountain pen habit."
  tagline        = "Ink, nibs, and paper — notes from a fountain pen habit"
  author         = "FP Enthusiast"
  email          = "hello@example.com"
  mainSections   = ["posts"]
  dateFormat     = "2 January 2006"
  titleSeparator = "·"
  footerText     = "Written by hand. Set in Fraunces & Inter."

[menus]
  [[menus.main]]
    name = "Home"
    pageRef = "/"
    weight = 10
  [[menus.main]]
    name = "Notes"
    pageRef = "/posts"
    weight = 20
  [[menus.main]]
    name = "About"
    pageRef = "/about"
    weight = 30

[taxonomies]
  tag = "tags"

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.parser]
    wrapStandaloneImageWithinParagraph = false
  [markup.highlight]
    codeFences = false
    tabWidth = 2
