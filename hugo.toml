# Theme defaults. Hugo merges this into consuming sites (site values win), so it
# carries only what the theme needs. Site keys (baseURL/title/locale) are omitted.
enableRobotsTXT = true

[pagination]
  pagerSize = 8

[params]
  mainSections = ["posts"]

[taxonomies]
  tag = "tags"

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.parser]
    wrapStandaloneImageWithinParagraph = false
  [markup.highlight]
    codeFences = false
    tabWidth = 2
