<!doctype html>
<html lang="{{ site.Language.Locale }}"{{ with site.Language.Direction }} dir="{{ . }}"{{ end }}>
<head>
  {{/* No-FOUC: apply the stored colour scheme before first paint (manual toggle). */}}
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  {{ partial "head.html" . }}
</head>
<body>
  <a class="skip-link" href="#main">{{ T "skipToContent" | default "Skip to content" }}</a>
  {{ partial "header.html" . }}
  <main id="main" class="site-main">
    <div class="wrap">{{ block "main" . }}{{ end }}</div>
  </main>
  {{ partial "footer.html" . }}
</body>
</html>
