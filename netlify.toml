[build]
  publish = "exampleSite/public"
  command = "hugo --gc --minify --source exampleSite -b $URL"

[build.environment]
  HUGO_VERSION = "0.158.0"
  TZ = "UTC"

[context.production.environment]
  HUGO_ENV = "production"

[context.deploy-preview]
  command = "hugo --gc --minify --source exampleSite -b $DEPLOY_PRIME_URL --environment development"

[context.branch-deploy]
  command = "hugo --gc --minify --source exampleSite -b $DEPLOY_PRIME_URL --environment development"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
